<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شجرة آل نحاس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#F5EDD8;--sand-mid:#E8D9B5;--sepia:#5C3D1E;
  --gold:#B8862A;--gold-lt:#D4A84B;--rose:#C5796A;
  --blue:#6A8FAF;--green:#7AAF8A;
  --fg:#1C1109;--bg:#FAF6EE;--card:#FFFFF8;
  --border:rgba(184,134,42,.22);
  --ff:'AbarMid','Scheherazade New','Noto Naskh Arabic',serif;
  --ffb:'Cairo','Noto Kufi Arabic','Segoe UI',system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --sand:#2A1F0E;--sand-mid:#3A2D18;--sepia:#D4A86A;
  --gold:#C8963A;--gold-lt:#E0B460;
  --fg:#EDE4D0;--bg:#1A1208;--card:#221910;
  --border:rgba(200,150,58,.20);color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--ffb);background:var(--bg);color:var(--fg);display:flex;flex-direction:column}

.hdr{background:var(--sand);border-bottom:2px solid var(--gold);flex-shrink:0}
.hdr-stripe{height:4px;background:linear-gradient(90deg,var(--rose),var(--gold),var(--gold-lt),var(--gold),var(--rose))}
.hdr-inner{padding:10px 16px 8px;text-align:center}
.hdr-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:2px}
.hdr-title{font-family:var(--ff);font-size:clamp(1rem,4vw,1.7rem);font-weight:700;color:var(--sepia)}
.hdr-sub{font-size:.6rem;color:var(--gold);font-weight:600;letter-spacing:.1em}
.hdr-nasab-wrap{margin-top:4px;text-align:center}
.nasab-toggle{background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.nasab-label{font-family:var(--ffb);font-size:.6rem;color:var(--gold);font-weight:600}
.nasab-arrow{font-size:.55rem;color:var(--gold);transition:transform .25s}
.nasab-arrow.open{transform:rotate(180deg)}
.hdr-nasab{font-family:var(--ff);font-size:.62rem;color:var(--sepia);opacity:.7;line-height:2;margin-top:5px;padding:6px 10px;background:color-mix(in srgb,var(--gold) 8%,transparent);border-radius:8px;border:1px solid color-mix(in srgb,var(--gold) 20%,transparent);
  word-break:break-word;white-space:normal;overflow-wrap:break-word;text-align:center;max-width:100%;box-sizing:border-box}

.tabs-bar{background:var(--sand-mid);border-bottom:2px solid var(--gold);flex-shrink:0;
  display:flex;overflow-x:auto;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:1;min-width:90px;padding:9px 14px;border:none;background:transparent;
  font-family:var(--ffb);font-size:.78rem;font-weight:600;color:var(--sepia);opacity:.6;
  cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.tab-btn.active{opacity:1;border-bottom-color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,transparent)}

.legend-bar{background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;
  padding:4px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.leg{display:flex;align-items:center;gap:4px;font-size:.62rem;color:var(--sepia);opacity:.8}
.leg-circle{width:12px;height:12px;border-radius:50%;border:2.5px solid}
.leg-m{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 15%,transparent)}
.leg-f{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 15%,transparent)}
.leg-rada{border-color:var(--gold);border-style:dashed}
.leg-dot{width:9px;height:9px;border-radius:50%;background:var(--green);border:1.5px solid var(--bg)}

.panel{flex:1;overflow:hidden;display:none}
.panel.active{display:flex;flex-direction:column}

/* ── DRILL TAB ── */
.stage{flex:1;position:relative;overflow:auto;-webkit-overflow-scrolling:touch}
#canvas{width:100%;min-height:100%;position:relative}
#lines-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
/* خط الأبناء — ذهبي عادي */
.line{stroke:var(--gold-lt);stroke-width:1.5;fill:none;opacity:.7;stroke-dasharray:1000;stroke-dashoffset:1000;transition:stroke-dashoffset .5s ease}
.line.drawn{stroke-dashoffset:0}
/* خط الزوجات — وردي متقطع واضح مختلف */
.line-wife{stroke:var(--gold-lt);stroke-width:2.5;stroke-dasharray:6 4;opacity:.75}
.line-spouse{stroke:var(--gold-lt);stroke-width:2;stroke-dasharray:6 4;opacity:.75}
.line-child{stroke:var(--gold-lt);stroke-width:1.5;fill:none;opacity:.85}
/* خط الابنة — ذهبي متصل (مثل الابن) */
.line-daughter{stroke:var(--gold-lt);stroke-width:1.5;fill:none;opacity:.85}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:opacity .35s,transform .35s;user-select:none}
.node.hidden{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.4)}
.node.visible{opacity:1;transform:translate(-50%,-50%) scale(1)}
.avatar-wrap{position:relative}
.avatar-ring{width:58px;height:58px;border-radius:50%;border:3px solid var(--blue);overflow:hidden;background:var(--sand-mid);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:box-shadow .2s}
.avatar-ring.female{border-color:var(--rose)}
.avatar-ring.rada{border-style:dashed!important}
.avatar-ring.rada:not(.female){border-color:var(--blue)!important}
.avatar-ring.rada.female{border-color:var(--rose)!important}
.avatar-ring.root{width:70px;height:70px;border-width:4px;border-color:var(--sepia)!important}
.avatar-wrap.root-wrap{width:70px;height:70px}
.avatar-wrap.big{width:70px;height:70px}
.avatar-ring.big{width:70px;height:70px;border-width:4px}
.avatar-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.default-avatar{width:70%;height:70%;opacity:.6}
/* 💍 بادج الزوجة — SVG لضمان ظهوره على كل المتصفحات */
.wife-badge{position:absolute;top:-5px;right:-5px;width:16px;height:16px;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
/* الزوج/الزوجة الخارجية — تظهر جنب العقدة */
.spouse-node{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:default;opacity:0;transition:opacity .3s .15s}
.spouse-node.show{opacity:1}
.spouse-ring{width:44px;height:44px;border-radius:50%;border:2px dashed var(--gold-lt);overflow:hidden;background:var(--sand-mid);display:flex;align-items:center;justify-content:center}
.spouse-ring.f{border-color:var(--rose)}
.spouse-ring.m{border-color:var(--blue)}
.spouse-name{font-family:var(--ff);font-size:.62rem;font-weight:700;color:var(--sepia);text-align:center;max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spouse-label{font-size:.5rem;color:var(--gold);font-weight:600}
/* خط أفقي متقطع يربط الشخص بزوجه */
.spouse-line{position:absolute;pointer-events:none}
.node-name{font-family:var(--ff);font-size:.8rem;font-weight:700;color:var(--sepia);text-align:center;background:var(--card);border:1px solid var(--border);border-radius:7px;padding:3px 9px;max-width:95px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.node.root .node-name{font-size:.92rem;max-width:115px}
.node:hover .avatar-ring{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 40%,transparent)}
/* رقم ترتيب الولادة */
.birth-order{position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  background:var(--sepia);color:var(--sand);font-family:var(--ffb);font-size:.5rem;
  font-weight:700;line-height:1;padding:1px 5px;border-radius:5px;min-width:16px;
  text-align:center;pointer-events:none;white-space:nowrap;opacity:.9;z-index:2}
/* زر ⓘ على يمين الصورة */
.node-info-btn{position:absolute;top:-3px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:11px;color:#fff;font-weight:700;line-height:1}
.node.focus .node-info-btn{display:flex}
/* سهم الرجوع على يسار الصورة عند hover */
.node-back-hint{position:absolute;top:-3px;left:-5px;width:20px;height:20px;border-radius:50%;background:color-mix(in srgb,var(--sepia) 20%,transparent);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.node.has-back .node-back-hint{display:flex}
.node-back-hint svg{width:12px;height:12px;fill:none;stroke:var(--sepia);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
/* back-btn removed — back arrow is on the node itself */
/* ── نافذة ⓘ المنبثقة (تعرض + تعديل) ── */
.info-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);border:1.5px solid var(--gold);border-radius:16px;padding:0;min-width:300px;max-width:520px;width:96vw;height:min(90vh,640px);display:flex;flex-direction:column;box-shadow:0 8px 28px rgba(0,0,0,.22);font-family:var(--ffb);z-index:200;transition:opacity .2s;overflow:hidden;direction:rtl}
.info-popup.hidden{opacity:0;pointer-events:none}
.info-av-row{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.info-av-wrap{position:relative;flex-shrink:0}
.info-av{width:50px;height:50px;border-radius:50%;border:2px solid var(--blue);overflow:hidden;background:var(--sand-mid);cursor:pointer}
.info-av.female{border-color:var(--rose)}
.info-av.rada-m{border-style:dashed;border-color:var(--blue)}
.info-av.rada-f{border-style:dashed;border-color:var(--rose)}
.info-av.root{border-color:var(--sepia);border-width:3px}
.info-av img,.info-av svg{width:100%;height:100%;object-fit:cover}
/* أيقونة المرسمة فوق يمين الصورة */
.info-av-edit{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--gold);border:1.5px solid var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;line-height:1;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.info-meta{flex:1;min-width:0}
.info-name{font-family:var(--ff);font-size:.95rem;font-weight:700;color:var(--sepia)}
.info-role{font-size:.62rem;font-weight:700;color:var(--gold)}
/* زر الإغلاق داخل النافذة */
.info-close-x{width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--sepia) 12%,transparent);border:none;font-size:.85rem;color:var(--sepia);opacity:.7;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--ffb);line-height:1;flex-shrink:0}
/* حقول التعديل داخل النافذة */
.info-fields{padding:10px 14px;overflow-y:auto;flex:1;min-height:0}
.sex-btn{flex:1;padding:6px 0;border-radius:8px;border:2px solid transparent;font-size:.78rem;font-family:var(--ffb);font-weight:700;cursor:pointer;transition:all .15s;opacity:.6;background:color-mix(in srgb,var(--sepia) 8%,transparent);color:var(--sepia)}
.sex-btn-m.selected{background:color-mix(in srgb,var(--blue) 25%,transparent);border-color:var(--blue);color:var(--blue);opacity:1}
.sex-btn-f.selected{background:color-mix(in srgb,var(--rose) 25%,transparent);border-color:var(--rose);color:var(--rose);opacity:1}
.info-field-row{margin-bottom:7px}
.info-field-label{display:block;font-size:.68rem;font-weight:600;color:var(--sepia);margin-bottom:2px;opacity:.7}
.info-field-input{width:100%;padding:5px 9px;border-radius:7px;border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);background:var(--sand);color:var(--fg);font-family:var(--ffb);font-size:.78rem}
.info-field-input:focus{outline:none;border-color:var(--gold)}
select.info-field-input{cursor:pointer}
textarea.info-field-input{resize:vertical;min-height:46px}
.info-save-row{display:flex;gap:6px;justify-content:flex-end;padding:0 14px 12px}
.info-save-btn{padding:5px 14px;border-radius:7px;border:none;background:var(--gold);color:#fff;font-family:var(--ffb);font-size:.78rem;font-weight:700;cursor:pointer}
.info-cancel-btn{padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--sepia);font-family:var(--ffb);font-size:.78rem;cursor:pointer;opacity:.7}

/* ── FULL TREE TAB ── */
.full-tree-wrap{flex:1;overflow:hidden;position:relative;background:var(--bg)}
#full-tree-svg{cursor:grab;transition:transform .05s}
#full-tree-svg:active{cursor:grabbing}
.ft-line{stroke:var(--gold-lt);stroke-width:1;fill:none;opacity:.6}
.ft-line-wife{stroke:var(--gold-lt);stroke-dasharray:4 2;opacity:.5}
.ft-line-daughter{stroke:var(--gold-lt);stroke-width:1;fill:none;opacity:.6}

/* ── PROFILES TAB ── */
.profiles-wrap{flex:1;overflow-y:auto;padding:12px}
.profiles-search{width:100%;padding:8px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--sand);color:var(--fg);font-family:var(--ffb);font-size:.85rem;margin-bottom:12px}
.profiles-search:focus{outline:none;border-color:var(--gold)}
.profiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.profile-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.profile-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.pc-avatar{width:56px;height:56px;border-radius:50%;margin:0 auto 7px;border:3px solid var(--blue);overflow:hidden;background:var(--sand-mid);display:flex;align-items:center;justify-content:center}
.pc-avatar.female{border-color:var(--rose)}
.pc-avatar.rada{border-style:dashed}
.pc-avatar.rada-m{border-color:var(--blue)}
.pc-avatar.rada-f{border-color:var(--rose)}
.pc-avatar.root{border-color:var(--sepia);border-width:4px}
.pc-avatar img,.pc-avatar svg{width:100%;height:100%;object-fit:cover}
.pc-name{font-family:var(--ff);font-size:.8rem;font-weight:700;color:var(--sepia);margin-bottom:1px}
.pc-role{font-size:.6rem;color:var(--gold);font-weight:600}
.pc-branch{font-size:.57rem;color:var(--sepia);opacity:.5;margin-top:1px}
.pc-edit-fab{position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:50%;background:transparent;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.15;transition:opacity .2s}
.profile-card:hover .pc-edit-fab{opacity:1}
.pc-edit-fab svg{width:10px;height:10px;fill:var(--gold)}

/* ── EDIT MODAL ── */
[hidden]{display:none!important}
.modal-bg{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(5px)}
.modal-box{background:var(--bg);border-radius:16px;padding:22px;max-width:380px;width:calc(100% - 24px);border-top:4px solid var(--gold);font-family:var(--ffb);direction:rtl;max-height:90vh;overflow-y:auto}
.modal-title{font-family:var(--ff);font-size:1.1rem;color:var(--sepia);margin-bottom:14px}
.modal-av-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.modal-av-preview{width:68px;height:68px;border-radius:50%;border:3px solid var(--gold);overflow:hidden;background:var(--sand-mid);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.modal-av-preview img,.modal-av-preview svg{width:100%;height:100%;object-fit:cover}
.av-hint{font-size:.7rem;color:var(--gold);cursor:pointer;margin-top:4px}
.av-hint:hover{text-decoration:underline}
.av-note{font-size:.6rem;color:var(--sepia);opacity:.5;margin-top:3px}
#avatar-file-input{display:none}
.form-row{margin-bottom:10px}
.form-label{display:block;font-size:.74rem;font-weight:600;color:var(--sepia);margin-bottom:3px}
.form-input{width:100%;padding:7px 11px;border-radius:8px;border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);background:var(--sand);color:var(--fg);font-family:var(--ffb);font-size:.82rem}
.form-input:focus{outline:none;border-color:var(--gold)}
textarea.form-input{resize:vertical;min-height:52px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn-cancel{padding:7px 15px;border-radius:8px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-family:var(--ffb);font-size:.8rem;cursor:pointer}
.btn-save{padding:7px 18px;border-radius:8px;border:none;background:var(--gold);color:#fff;font-family:var(--ffb);font-size:.8rem;font-weight:700;cursor:pointer}

.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#2D6A2D;color:#fff;padding:8px 18px;border-radius:10px;font-family:var(--ffb);font-size:.8rem;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<header class="hdr">
  <div class="hdr-stripe"></div>
  <div class="hdr-inner">
    <div class="hdr-logo">
      <svg width="40" height="40" viewBox="0 0 44 44" fill="none">
        <rect x="19.5" y="28" width="5" height="13" rx="2.5" fill="#B8862A"/>
        <ellipse cx="22" cy="24" rx="13" ry="9" fill="#7AAF8A" opacity=".3"/>
        <ellipse cx="22" cy="19" rx="10" ry="8" fill="#B8862A" opacity=".45"/>
        <ellipse cx="22" cy="13" rx="8" ry="7" fill="#D4A84B" opacity=".8"/>
        <circle cx="22" cy="7" r="3" fill="#D4A84B"/>
        <circle cx="14" cy="14" r="2" fill="#D4A84B" opacity=".7"/>
        <circle cx="30" cy="14" r="2" fill="#D4A84B" opacity=".7"/>
        <circle cx="11" cy="22" r="1.8" fill="#7AAF8A" opacity=".9"/>
        <circle cx="33" cy="22" r="1.8" fill="#7AAF8A" opacity=".9"/>
      </svg>
      <div>
        <div class="hdr-title">شجرة آل نحاس</div>
        <div class="hdr-sub">شجرة العائلة — ١٤٤٧ هـ</div>
      </div>
    </div>
    <div class="hdr-nasab-wrap">
      <button class="nasab-toggle" id="nasab-toggle" onclick="toggleNasab()">
        <span class="nasab-label">النسب الكامل</span>
        <span class="nasab-arrow" id="nasab-arrow">▼</span>
      </button>
      <div class="hdr-nasab" id="nasab-text" hidden>زامل جميل سليمان عبيد عويد حسن شداد محمد عبدالله شاكر زيد هاشم سالم عبدالله بن عمر بن الخطاب ﵁</div>
    </div>
  </div>
</header>

<div class="tabs-bar">
  <button class="tab-btn active" onclick="switchTab('drill')">🌳 الشجرة التفاعلية</button>
  <button class="tab-btn" onclick="switchTab('full')">🗺️ الشجرة الكاملة</button>
  <button class="tab-btn" onclick="switchTab('profiles')">👥 بطاقات الأعضاء</button>
</div>

<div class="legend-bar">
  <div class="leg"><div class="leg-circle leg-m"></div>ذكر</div>
  <div class="leg"><div class="leg-circle leg-f"></div>أنثى</div>
  <div class="leg"><div class="leg-circle leg-rada" style="border-color:var(--blue)"></div>ابن رضاعة</div>
  <div class="leg"><div class="leg-circle leg-rada" style="border-color:var(--rose)"></div>ابنة رضاعة</div>
  <div class="leg"><div style="width:26px;height:0;border-top:2.5px solid var(--gold-lt);opacity:.85"></div>ابن/ـة</div>
  <div class="leg"><div style="width:26px;height:0;border-top:2.5px dashed var(--gold-lt);opacity:.85"></div>زوج/ـة</div>
</div>

<!-- TAB 1 -->
<div class="panel active" id="panel-drill">
  <div class="stage" id="stage">
    <div id="canvas"><svg id="lines-svg"></svg></div>
  </div>
</div>

<!-- TAB 2 -->
<div class="panel" id="panel-full">
  <div class="full-tree-wrap" id="full-tree-wrap">
    <svg id="full-tree-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<!-- TAB 3 -->
<div class="panel" id="panel-profiles">

const SB_URL='https://thzczmcuybqrvcxgfzny.supabase.co';

let sb=null;try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){console.error('supabase init',e)}
let cloudIds=new Set();     /* الأعضاء الموجودين في السحابة */
let lastOwnSave=0;          /* لتجاهل إشعار التحديث الناتج عن حفظنا نحن */

function saveData(){
  try{localStorage.setItem('fam_data',JSON.stringify(FAM))}catch(e){}

async function pushToCloud(){
  if(!sb)return;
  lastOwnSave=Date.now();
  const rows=Object.keys(FAM).map(id=>({id,data:FAM[id]}));
  const {error}=await sb.from('members').upsert(rows,{onConflict:'id'});
  if(error){console.error('cloud save',error);showToast('⚠ ما انحفظ في السحابة — تأكد من الإنترنت');return;}
  const gone=[...cloudIds].filter(id=>!FAM[id]);
  if(gone.length){const r=await sb.from('members').delete().in('id',gone);if(r.error)console.error('cloud delete',r.error);}
  cloudIds=new Set(Object.keys(FAM));
  lastOwnSave=Date.now();
}

}
async function pullFromCloud(){
  if(!sb)return;
  const {data,error}=await sb.from('members').select('id,data');
  if(error){console.error('cloud load',error);return;}
  if(!data.length){
    /* أول مرة: السحابة فاضية — ارفع البيانات الموجودة */
    if(Object.keys(FAM).length>1){await pushToCloud();showToast('✓ تم رفع بيانات العائلة للسحابة');}
    return;
  }
  const next={};data.forEach(r=>next[r.id]=r.data);
  FAM=next;cloudIds=new Set(Object.keys(FAM));
  try{localStorage.setItem('fam_data',JSON.stringify(FAM))}catch(e){}
  rerenderCurrent();
}
function startCloud(){
  if(!sb)return;
  pullFromCloud();
  let t=null;
  sb.channel('members-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'members'},()=>{
      if(Date.now()-lastOwnSave<3000)return;
      clearTimeout(t);t=setTimeout(pullFromCloud,400);
    }).subscribe();
}

  const link=m.sex==='f'?'ابنة':'ابن';
  if(par.role==='wife') return link+' زامل (من '+par.name.split(' ')[0]+')';
  if(par.role==='root') return link+' زامل';
  return link+' '+par.name.split(' ')[0];
}

/* ── اسم واحد للعرض على الكارد ── */
function shortName(fullName,id){
  /* إذا عنده حقل short خاص (مثل أم كلثوم) استخدمه */
  if(id && FAM[id]?.short) return FAM[id].short;
  return fullName?fullName.split(' ')[0]:''
}

function createNode(id){
  if(nodeEls[id]&&nodeEls[id].isConnected)return nodeEls[id];
  const m=FAM[id];
  const isRoot=m.role==='root';
  const div=document.createElement('div');
  div.className='node hidden';
  div.dataset.id=id;
  const awrap=document.createElement('div');
  awrap.className='avatar-wrap'+(isRoot?' root-wrap':'');
  const ring=document.createElement('div');
  ring.className='avatar-ring'+(m.sex==='f'?' female':'')+(m.rada?' rada':'')+(isRoot?' root':'');
  ring.innerHTML=avatarHTML(id);
  /* زوجات زامل: الدائرة الوردية كافية للتمييز — لا بادج إضافي */
  /* زر ⓘ على اليمين */
  const infoBtn=document.createElement('button');
  infoBtn.className='node-info-btn';infoBtn.title='معلومات وتعديل';
  infoBtn.textContent='ⓘ';
  infoBtn.onclick=e=>{e.stopPropagation();openInfoPanel(id)};
  /* سهم رجوع صغير على اليسار */
  const backHint=document.createElement('button');
  backHint.className='node-back-hint';backHint.title='رجوع';
  backHint.innerHTML='<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>';
  backHint.onclick=e=>{e.stopPropagation();goBack()};
  /* رقم ترتيب الولادة */
  if(m.par && FAM[m.par] && !m.rada && m.role!=='wife'){
    /* رقم الترتيب الصريح إن وُجد */
    if(m.order){
      const ob=document.createElement('span');ob.className='birth-order';
      ob.textContent='#'+m.order;
      awrap.appendChild(ob);
    }
  }
  awrap.appendChild(ring);awrap.appendChild(infoBtn);awrap.appendChild(backHint);
  /* اسم واحد فقط */
  const lbl=document.createElement('div');lbl.className='node-name';lbl.textContent=shortName(m.name,id);
  div.appendChild(awrap);div.appendChild(lbl);
  div.addEventListener('click',e=>{e.stopPropagation();onNodeClick(id)});
  canvas.appendChild(div);nodeEls[id]=div;return div;
}

function placeNodes(ids,parentId){
  const {w,h}=getSize();const n=ids.length;
  const SIDE_PAD=45;
  /* RTL: نعكس ترتيب المواضع — الأول (i=0) يأخذ أقصى اليمين */
  ids.forEach((id,i)=>{
    const el=createNode(id);
    el.querySelectorAll('.big').forEach(e=>e.classList.remove('big'));
    let x,y;
    const iRTL=n-1-i; /* الترتيب المعكوس للموضع الأفقي */

    const parEl=parentId?nodeEls[parentId]:null;
    const parY=parEl?parseFloat(parEl.style.top):h*0.17;

    if(!parentId){
      x=w/2; y=h/2;
    } else if(w<540){
      /* جوال: عمودان، الأول يسار */
      const col=i%2; const row=Math.floor(i/2);
      const colGap=Math.min(w*0.26, w/2-SIDE_PAD-10);
      x=w/2+(col===0?-colGap:colGap);
      y=parY+135+row*110;
    } else {
      const usable=w-2*SIDE_PAD;
      const gap=Math.max(70, Math.min(110, usable/(n>1?n-1:1)));
      const totalSpan=(n-1)*gap;
      if(n===1) x=w/2;
      else x=w/2 - totalSpan/2 + i*gap; /* i=0 → أقصى اليسار، i=n-1 → أقصى اليمين */
      x=Math.max(SIDE_PAD, Math.min(w-SIDE_PAD, x));
      y=parY+160;
    }

    el.style.left=x+'px'; el.style.top=y+'px';
    setTimeout(()=>{
      el.classList.remove('hidden');el.classList.add('visible');
      const needed=y+160;
      if(parseInt(canvas.style.height||0)<needed) canvas.style.height=needed+'px';
    },20+i*25);
  });
}

/* ── إعادة رسم عند تغيير حجم النافذة ── */
let resizeTimer=null;
window.addEventListener('resize',()=>{

/* ── الزوج/الزوجة الخارجية ── */
let spouseEls=[];
function clearSpouses(){spouseEls.forEach(e=>e.remove());spouseEls=[]}

/* يُظهر الزوجة/الزوجات جانب العقدة كعقد حقيقية قابلة للنقر */
/* يطابق حجم دائرة الزوج/الزوجة مع صاحبها */
function matchSize(ownerEl,spEl){
  const big=!!ownerEl.querySelector('.avatar-ring.root,.avatar-ring.big');
  spEl.querySelector('.avatar-wrap').classList.toggle('big',big);
  spEl.querySelector('.avatar-ring').classList.toggle('big',big);
}
/* خط منقط ذهبي بين دائرتين — في منتصف الدائرتين بالضبط */
function spouseLink(aEl,bEl){
  const line=document.createElement('div');
  line.style.cssText='position:absolute;height:0;border-top:2.5px dashed var(--gold-lt);opacity:.85;transform:translateY(-50%);pointer-events:none;z-index:1';
  canvas.appendChild(line);spouseEls.push(line);
  requestAnimationFrame(()=>{
    const cr=canvas.getBoundingClientRect();
    const ra=aEl.querySelector('.avatar-ring').getBoundingClientRect();
    const rb=bEl.querySelector('.avatar-ring').getBoundingClientRect();
    const [l,r]=ra.left<rb.left?[ra,rb]:[rb,ra];
    const GAP=6;
    line.style.left=(l.right-cr.left+GAP)+'px';
    line.style.width=Math.max(8,r.left-l.right-2*GAP)+'px';
    line.style.top=((ra.top+ra.height/2)-cr.top)+'px';
  });
  return line;
}

function showSpouseFor(id){
  const m=FAM[id];
  const nodeEl=nodeEls[id];if(!nodeEl)return;
  /* لا نعرض زر الزوج/زوجة للشخص الذي هو نفسه زوج/زوجة */
  if(m.role==='wife') return;
  /* رتّب الزوجات/الأزواج بحسب order ثم بحسب ترتيب الإضافة */
  const spIds=(m.spouseIds||[]).filter(s=>FAM[s]).sort((a,b)=>{
    const oa=FAM[a]?.order??9999;
    const ob=FAM[b]?.order??9999;
    return oa-ob;
  });
  const nx=parseFloat(nodeEl.style.left);
  const ny=parseFloat(nodeEl.style.top);
  const OFFSET=105;
  /* الذكر: الزوجة يمينه — الأنثى: الزوج يسارها */
  const DIR=m.sex==='f'?-1:1;

  spIds.forEach((spId,si)=>{
    const spX=nx+DIR*OFFSET*(si+1);
    const spY=ny;

    /* عقدة الزوج/الزوجة كـ node حقيقية */
    const spEl=createNode(spId);
    spEl.style.left=spX+'px';
    spEl.style.top=spY+'px';
    spEl.classList.remove('hidden');spEl.classList.add('visible');
    spouseEls.push(spEl);

    matchSize(nodeEl,spEl);
    spouseLink(nodeEl,spEl);
  });

}

function addNewSpouseFor(ownerId,sex){
  const spId='sp_'+ownerId+'_'+Date.now();
  const label=sex==='f'?'زوجة':'زوج';
  FAM[spId]={
    name:label,short:label,sex:sex,role:'wife',
    par:ownerId,children:[],photo:null,
    relType:sex==='f'?'wife':'husband'
  };
  if(!FAM[ownerId].spouseIds) FAM[ownerId].spouseIds=[];
  FAM[ownerId].spouseIds.push(spId);
  saveData();
  /* أعد رسم الزوجات */
  spouseEls.forEach(el=>el.remove());spouseEls=[];
  showSpouseFor(ownerId);
  /* افتح info panel للزوج/الزوجة الجديد */
  setTimeout(()=>openInfoPanel(spId),200);
}

/* أبناء زوجة معيّنة: أبناء الزوج اللي أمهم هي، + أبناء مسجلين عليها قديماً.
   إذا عنده زوجة وحدة: كل أبنائه بدون أم محددة يُحسبون لها */
function kidsOfCouple(husbandId,wifeId){
  const h=FAM[husbandId]||{};const w=FAM[wifeId]||{};
  const oneWife=(h.spouseIds||[]).filter(x=>FAM[x]).length===1;
  const fromH=sortedChildren(husbandId).filter(k=>FAM[k]&&FAM[k].role!=='wife'&&(FAM[k].mother===wifeId||(oneWife&&!FAM[k].mother)));
  const fromW=sortedChildren(wifeId).filter(k=>FAM[k]&&!fromH.includes(k));
  return fromH.concat(fromW);
}

/* كل زوجات الشخص: المسجلات في spouseIds أو ضمن children بدور زوجة */
function wivesOf(id){
  const m=FAM[id]||{};
  const a=(m.spouseIds||[]).filter(x=>FAM[x]);
  const b=(m.children||[]).filter(x=>FAM[x]&&FAM[x].role==='wife');
  return [...new Set([...a,...b])].sort((x,y)=>(FAM[x]?.order??9999)-(FAM[y]?.order??9999));
}

function showSpouseView(spId,clickedId){
  const sp=FAM[spId];
  /* الزوج: من par، أو من الشخص اللي الزوجة مسجلة عنده */
  const ownerId=(sp.par&&FAM[sp.par])?sp.par:Object.keys(FAM).find(k=>(FAM[k].children||[]).includes(spId)||(FAM[k].spouseIds||[]).includes(spId));
  const owner=FAM[ownerId];if(!owner)return;
  const husbandId=owner.sex==='f'?spId:ownerId;
  const wifeId=owner.sex==='f'?ownerId:spId;
  history.push('sp:'+spId);hideAll();
  const {w,h}=getSize();
  const DIR=owner.sex==='f'?-1:1;
  const ox=w/2-DIR*52, oy=h*0.17;
  /* صاحب الشجرة */
  createNode(ownerId);
  nodeEls[ownerId].style.left=ox+'px';nodeEls[ownerId].style.top=oy+'px';
  /* الزوج/الزوجة المختارة جنبه */
  createNode(spId);
  const sx=ox+DIR*105;
  nodeEls[spId].style.left=sx+'px';nodeEls[spId].style.top=oy+'px';
  [ownerId,spId].forEach(i=>{nodeEls[i].classList.remove('hidden');nodeEls[i].classList.add('visible')});
  matchSize(nodeEls[ownerId],nodeEls[spId]);
  spouseLink(nodeEls[ownerId],nodeEls[spId]);
  /* الأبناء تحت الزوج بخطوط متصلة */
  const kids=kidsOfCouple(husbandId,wifeId);
  if(kids.length){
    kids.forEach(k=>createNode(k));placeNodes(kids,husbandId);
    setTimeout(()=>kids.forEach(k=>drawLine(husbandId,k,false)),150);
  }
  markFocus(clickedId||(owner.sex==='f'?ownerId:spId),ownerId);
  backBtn.classList.remove('hidden');
}

/* الشخص المعروض فوق: يظهر عليه زر الرجوع دايماً */
/* ⓘ على الشخص اللي ضغطت عليه فقط — والرجوع على الشخص اللي فوق */
function markFocus(id,backId=id){
  document.querySelectorAll('.node.focus,.node.has-back').forEach(n=>n.classList.remove('focus','has-back'));
  if(id&&nodeEls[id])nodeEls[id].classList.add('focus');
  if(history.length&&backId&&nodeEls[backId])nodeEls[backId].classList.add('has-back');
}

function hideAll(){
  Object.values(nodeEls).forEach(el=>{el.classList.remove('visible');el.classList.add('hidden')});
  lineEls.forEach(l=>l.remove());lineEls=[];
  clearSpouses();
}

function showRoot(){hideAll();history=[];createNode('zamil');placeNodes(['zamil'],null);markFocus('zamil');backBtn.classList.add('hidden');closeInfo()}

function onNodeClick(id){
  /* الضغط على الكارد: يفتح الأبناء أو يعرض الشخص مع زوجاته */
  const m=FAM[id];if(!m)return;
  /* الزوجات والأزواج (role=wife) لا يُفتح لهم view مستقل — نتجاهل الضغط */
  if(m.role==='wife'){showSpouseView(id);return;}
  /* البنت المتزوجة: زوجها يسارها وأبناؤها يتفرعون من زوجها */
  if(m.sex==='f'){
    const hs=wivesOf(id);
    if(hs.length===1&&history[history.length-1]!=='sp:'+hs[0]){showSpouseView(hs[0],id);return;}
  }
  const kids=wivesOf(id).length>=2?wivesOf(id):sortedChildren(id);
  if(kids.length>0 && history[history.length-1]!==id){
    expandNode(id);
  } else if(history[history.length-1]!==id){
    /* شخص بدون أبناء — اعرضه منفرداً مع زوجاته وزر إضافة */
    history.push(id);hideAll();
    const {w,h}=getSize();
    createNode(id);
    nodeEls[id].style.left=w/2+'px';nodeEls[id].style.top=h*0.5+'px';
    nodeEls[id].classList.remove('hidden');nodeEls[id].classList.add('visible');
    setTimeout(()=>showSpouseFor(id),200);
    markFocus(id);
    backBtn.classList.remove('hidden');
  }
}

function expandNode(id){
  const ws=wivesOf(id);
  const multi=ws.length>=2;
  /* عنده أكثر من زوجة: تطلع زوجاته فقط ويختفي الأبناء لين تختار زوجة */
  const kids=multi?ws:sortedChildren(id);if(!kids.length)return;
  /* لا تكرر نفس العقدة في التاريخ */
  if(history[history.length-1]===id)return;
  history.push(id);hideAll();
  const {w,h}=getSize();
  createNode(id);
  nodeEls[id].style.left=w/2+'px';nodeEls[id].style.top=h*0.17+'px';
  nodeEls[id].classList.remove('hidden');nodeEls[id].classList.add('visible');
  kids.forEach(kid=>createNode(kid));placeNodes(kids,id);
  setTimeout(()=>{
    kids.forEach(kid=>drawLine(id,kid,multi||FAM[kid]?.role==='wife'));
    if(!multi) showSpouseFor(id);
  },150);
  markFocus(id);
  backBtn.classList.remove('hidden');
}

/* يفتح شاشة محفوظة في السجل كما كانت */
function openEntry(e){
  if(typeof e==='string'&&e.startsWith('sp:')){showSpouseView(e.slice(3));return;}
  if(sortedChildren(e).length||wivesOf(e).length>=2) expandNode(e); else onNodeClick(e);
}
/* رجوع: يرجع للشاشة اللي قبلها بالضبط */
function goBack(){
  closeInfo();
  if(history.length<=1){showRoot();return}
  history.pop();
  const prev=history.pop();

}

function drawLine(a,b,isWife=false){
  const aEl=nodeEls[a],bEl=nodeEls[b];if(!aEl||!bEl)return;
  const fx=parseFloat(aEl.style.left),fy=parseFloat(aEl.style.top);
  const tx=parseFloat(bEl.style.left),ty=parseFloat(bEl.style.top);
  const my=(fy+ty)/2;
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',`M${fx},${fy} C${fx},${my} ${tx},${my} ${tx},${ty}`);
  /* نوع الخط: زوج/زوجة → وردي منقط، ابن → ذهبي متصل، ابنة → ذهبي منقط */
  const rt=FAM[b]?.relType;
  const sex=FAM[b]?.sex;
  let cls='line';
  if(isWife||rt==='husband'||rt==='wife') cls+=' line-wife';
  else if(rt==='daughter'||rt==='daughter-rada'||(rt==null&&sex==='f')) cls+=' line-daughter';
  else cls+=' line-child';
  path.setAttribute('class',cls);
  linesSVG.appendChild(path);lineEls.push(path);
  setTimeout(()=>path.classList.add('drawn'),30);
}

/* ── حساب العمر من تاريخ ميلادي أو هجري ── */
function parseYear(str){
  if(!str)return null;
  str=str.trim();
  /* هجري: ينتهي بـ هـ أو ه أو H */
  const hijriMatch=str.match(/^(\d{3,4})\s*[ههH]$/i);
  if(hijriMatch){
    const hYear=parseInt(hijriMatch[1]);
    /* تحويل تقريبي: السنة الهجرية → ميلادية */
    return Math.round(hYear*0.9702+621.57);
  }
  /* ميلادي: نأخذ أول 4 أرقام */
  const mMatch=str.match(/(\d{4})/);
  if(mMatch)return parseInt(mMatch[1]);
  return null;
}

function calcAge(birthStr,deathStr){
  const by=parseYear(birthStr);if(!by)return{birth:null,death:null,age:null};
  const dy=deathStr?parseYear(deathStr):null;
  const refYear=dy||new Date().getFullYear();
  return{birth:by,death:dy,age:refYear-by};
}

function updateAgeDisplay(){
  const bVal=document.getElementById('edit-birth').value;
  const dVal=document.getElementById('edit-death').value;
  const ageInput=document.getElementById('edit-age');
  const badge=document.getElementById('info-age-badge');
  /* إذا كان في خانة الوفاة قيمة، لا نحسب العمر */
  if(dVal && dVal.trim()){
    if(ageInput && document.activeElement!==ageInput) ageInput.value='';
    if(badge) badge.textContent='';
    return;
  }
  const r=calcAge(bVal,dVal);
  if(r.age!==null && r.age>=0 && r.age<150){
    /* اعرض العمر في المربع فقط إذا لم يكن المستخدم يكتب فيه */
    if(ageInput && document.activeElement!==ageInput) ageInput.value=r.age;
    if(badge) badge.textContent='🎂 العمر: '+r.age+' سنة';
  } else {
    if(ageInput && document.activeElement!==ageInput) ageInput.value='';
    if(badge) badge.textContent='';
  }
}

function updateBirthFromAge(){
  /* إذا أدخل المستخدم عمراً يدوياً نحسب سنة الميلاد التقريبية */
  const ageInput=document.getElementById('edit-age');
  const age=parseInt(ageInput?.value);
  if(!isNaN(age) && age>=0 && age<150){
    const birthYear=new Date().getFullYear()-age;
    document.getElementById('edit-birth').value=birthYear+'';
  }
}

let ftBuilt=false;
function buildFullTree(){
  if(ftBuilt)return;ftBuilt=true;
  const svg=document.getElementById('full-tree-svg');
  const wrap=document.getElementById('full-tree-wrap');
  const W=wrap.offsetWidth||700,H=wrap.offsetHeight||500;
  const NS='http://www.w3.org/2000/svg';

  const positions={};
  const wives=['abeer','faiza','layla'];
  positions['zamil']={x:W/2,y:50};
  const wifeW=W/(wives.length+1);
  wives.forEach((w,i)=>{
    const wx=wifeW*(i+1);positions[w]={x:wx,y:140};
    const kids=FAM[w].children||[];
    if(!kids.length)return;
    const kw=wifeW/(kids.length+1);
    kids.forEach((k,j)=>{
      const kx=wifeW*i+kw*(j+1);positions[k]={x:kx,y:240};
      const gkids=FAM[k]?.children||[];
      const gkw=kw/(gkids.length+1);
      gkids.forEach((gk,gi)=>{positions[gk]={x:wifeW*i+kw*j+gkw*(gi+1),y:340}});
    });
  });

  let minX=1e9,maxX=-1e9,maxY=0;
  Object.values(positions).forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y)});
  const svgW=Math.max(maxX+60,W),svgH=maxY+70;
  svg.setAttribute('viewBox',`0 0 ${svgW} ${svgH}`);
  svg.setAttribute('width',svgW);svg.setAttribute('height',svgH);

  function mkLine(x1,y1,x2,y2,childId=null,wife=false){
    const path=document.createElementNS(NS,'path');
    const my=(y1+y2)/2;
    path.setAttribute('d',`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
    let cls='ft-line';
    if(wife) cls+=' ft-line-wife';
    else if(childId){
      const rt=FAM[childId]?.relType;
      const sx=FAM[childId]?.sex;
      if(rt==='daughter'||rt==='daughter-rada'||(rt==null&&sx==='f')) cls+=' ft-line-daughter';
    }
    path.setAttribute('class',cls);
    svg.insertBefore(path,svg.firstChild);
  }
  function mkNode(id,pos){
    const m=FAM[id];if(!m)return;
    const g=document.createElementNS(NS,'g');
    g.setAttribute('transform',`translate(${pos.x},${pos.y})`);
    g.style.cursor='pointer';
    const fill=m.sex==='f'?'#C5796A':'#6A8FAF';
    const r=m.role==='root'?11:7;
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('r',r);c.setAttribute('fill',fill);c.setAttribute('opacity','.85');
    c.setAttribute('stroke','#FAF6EE');c.setAttribute('stroke-width','1.5');
    if(m.rada)c.setAttribute('stroke-dasharray','3 2');
    const t=document.createElementNS(NS,'text');
    t.setAttribute('text-anchor','middle');t.setAttribute('dy',r+11);
    t.setAttribute('font-size',m.role==='root'?'10':'8');
    t.setAttribute('fill','var(--sepia)');t.setAttribute('font-family','var(--ffb)');
    t.textContent=m.name;
    if((m.children||[]).length>0){
      const d=document.createElementNS(NS,'circle');
      d.setAttribute('cx',r-1);d.setAttribute('cy',-(r-1));d.setAttribute('r',3);
      d.setAttribute('fill','#7AAF8A');d.setAttribute('stroke','#FAF6EE');d.setAttribute('stroke-width','1');
      g.appendChild(d);
    }
    g.appendChild(c);g.appendChild(t);
    g.addEventListener('click',()=>{switchTab('drill');setTimeout(()=>{showRoot();onNodeClick(id)},100)});
    svg.appendChild(g);
  }

  const pZ=positions['zamil'];
  wives.forEach(w=>{
    const pw=positions[w];if(!pw)return;
    mkLine(pZ.x,pZ.y,pw.x,pw.y,null,true);
    (FAM[w].children||[]).forEach(k=>{
      const pk=positions[k];if(!pk)return;
      mkLine(pw.x,pw.y,pk.x,pk.y,k);
      (FAM[k]?.children||[]).forEach(gk=>{const pg=positions[gk];if(pg)mkLine(pk.x,pk.y,pg.x,pg.y,gk)});
    });
  });
  Object.entries(positions).forEach(([id,pos])=>mkNode(id,pos));

  // Pan/Zoom
  let vx=0,vy=0,sc=1,drag=false,sx,sy,svx,svy;
  function applyT(){svg.style.transform=`translate(${vx}px,${vy}px) scale(${sc})`;svg.style.transformOrigin='0 0'}
  wrap.addEventListener('mousedown',e=>{drag=true;sx=e.clientX;sy=e.clientY;svx=vx;svy=vy});
  window.addEventListener('mousemove',e=>{if(!drag)return;vx=svx+(e.clientX-sx);vy=svy+(e.clientY-sy);applyT()});
  window.addEventListener('mouseup',()=>drag=false);
  wrap.addEventListener('wheel',e=>{e.preventDefault();sc=Math.max(.3,Math.min(3,sc-e.deltaY*.001));applyT()},{passive:false});
  let t0={};
  wrap.addEventListener('touchstart',e=>{[...e.touches].forEach(t=>t0[t.identifier]={x:t.clientX,y:t.clientY});svx=vx;svy=vy},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(e.touches.length===1){const t=e.touches[0];const d=t0[t.identifier];if(!d)return;vx=svx+(t.clientX-d.x);vy=svy+(t.clientY-d.y);applyT()}},{passive:true});
}

/* ── Crop دائري ── */
let cropImg=null,cropDrag=false,cropX=0,cropY=0,cropOX=0,cropOY=0,cropScale=1,cropBaseScale=1;

function handleAvatarUpload(e){
  const f=e.target.files[0];if(!f)return;
  if(f.size>15*1024*1024){showToast('الصورة أكبر من 15MB');return}
  /* أزل modal قديم لضمان بداية نظيفة */
  const old=document.getElementById('crop-modal');if(old)old.remove();
  e.target.value='';
  loadPhotoFile(f);
}
/* يقرأ الصورة — ويحوّل صور الآيفون HEIC إلى JPG تلقائياً */
async function loadPhotoFile(f){
  const isHeic=/heic|heif/i.test(f.type)||/\.(heic|heif)$/i.test(f.name);
  let blob=f;
  if(isHeic){
    showToast('⏳ جاري تجهيز الصورة...');
    try{
      if(!window.heic2any){
        await new Promise((ok,no)=>{const sc=document.createElement('script');
          sc.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc);});
      }
      const out=await window.heic2any({blob:f,toType:'image/jpeg',quality:.9});
      blob=Array.isArray(out)?out[0]:out;
    }catch(err){console.error('heic',err);}
  }
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{cropImg=img;openCropModal();};
  img.onerror=()=>{URL.revokeObjectURL(url);showToast('⚠ ما قدرت أفتح الصورة — جرّب صورة JPG أو PNG');};
  img.src=url;
}

function openCropModal(){
  if(!cropImg)return;
  /* ── الحساب الأساسي: تكبير الصورة لتملأ الدائرة 260px ── */
  const CS=260;
  cropBaseScale=CS/Math.min(cropImg.width,cropImg.height);
  cropScale=cropBaseScale;
  cropX=(CS-cropImg.width*cropScale)/2;
  cropY=(CS-cropImg.height*cropScale)/2;

  /* ── إنشاء modal جديد في كل مرة ── */
  const modal=document.createElement('div');
  modal.id='crop-modal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px';
  modal.innerHTML=`
    <div style="color:#fff;font-family:var(--ffb);font-size:.82rem;opacity:.75;text-align:center">حرك الصورة ثم اضغط تطبيق</div>
    <canvas id="crop-canvas" width="${CS}" height="${CS}" style="border-radius:50%;cursor:grab;touch-action:none;border:3px solid var(--gold);display:block"></canvas>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="color:#fff;opacity:.6;font-size:.75rem">−</span>
      <input id="crop-zoom" type="range" min="100" max="400" value="100" style="width:180px;accent-color:var(--gold)">
      <span style="color:#fff;opacity:.6;font-size:.75rem">+</span>
    </div>
    <div style="display:flex;gap:12px">
      <button id="crop-apply-btn" style="padding:9px 28px;border-radius:10px;border:none;background:var(--gold);color:#fff;font-family:var(--ffb);font-size:.85rem;cursor:pointer">✓ تطبيق</button>
      <button id="crop-cancel-btn" style="padding:9px 28px;border-radius:10px;border:1.5px solid #fff5;background:transparent;color:#fff;font-family:var(--ffb);font-size:.85rem;cursor:pointer">إلغاء</button>
    </div>`;
  document.body.appendChild(modal);

  const cv=modal.querySelector('#crop-canvas');
  const zm=modal.querySelector('#crop-zoom');

  /* zoom: القيمة 100 = cropBaseScale، 400 = 4× cropBaseScale */
  zm.addEventListener('input',()=>{
    cropScale=cropBaseScale*(zm.value/100);
    drawCrop(cv);
  });

  /* سحب ماوس */
  cv.addEventListener('mousedown',ev=>{cropDrag=true;cv.style.cursor='grabbing';cropOX=ev.clientX-cropX;cropOY=ev.clientY-cropY;ev.preventDefault()});
  window.addEventListener('mousemove',ev=>{if(!cropDrag)return;cropX=ev.clientX-cropOX;cropY=ev.clientY-cropOY;drawCrop(cv)});
  window.addEventListener('mouseup',()=>{cropDrag=false;cv.style.cursor='grab'},{once:false});

  /* سحب لمس */
  cv.addEventListener('touchstart',ev=>{const t=ev.touches[0];cropDrag=true;cropOX=t.clientX-cropX;cropOY=t.clientY-cropY},{passive:true});
  cv.addEventListener('touchmove',ev=>{if(!cropDrag)return;const t=ev.touches[0];cropX=t.clientX-cropOX;cropY=t.clientY-cropOY;drawCrop(cv);ev.preventDefault()},{passive:false});
  cv.addEventListener('touchend',()=>cropDrag=false);

  modal.querySelector('#crop-apply-btn').onclick=()=>applyCrop(cv,modal);
  modal.querySelector('#crop-cancel-btn').onclick=()=>modal.remove();

  drawCrop(cv);
}

function drawCrop(cv){
  if(!cv||!cropImg)return;
  const CS=260;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,CS,CS);
  ctx.save();
  ctx.beginPath();ctx.arc(CS/2,CS/2,CS/2,0,Math.PI*2);ctx.clip();
  ctx.drawImage(cropImg,cropX,cropY,cropImg.width*cropScale,cropImg.height*cropScale);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(CS/2,CS/2,CS/2-1,0,Math.PI*2);ctx.stroke();
}

function applyCrop(cv,modal){
  if(!cv)return;
  const out=document.createElement('canvas');out.width=200;out.height=200;
  const ctx=out.getContext('2d');
  ctx.beginPath();ctx.arc(100,100,100,0,Math.PI*2);ctx.clip();
  ctx.drawImage(cv,0,0,260,260,0,0,200,200);
  const dataUrl=out.toDataURL('image/jpeg',0.85);
  pendingPhoto=dataUrl;
  /* تحديث فوري للصورة في النافذة */
  const avEl=document.getElementById('info-av');
  if(avEl){
    avEl.innerHTML=`<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  }
  if(modal) modal.remove();
}
/* يرتب أبناء شخص حسب order (من لا order له يأتي آخراً بترتيب إضافته) */
function sortedChildren(id){
  const kids=(FAM[id]?.children||[]).slice();
  /* استخرج سنة الميلاد من نص الميلاد */
  function birthYear(x){
    const b=FAM[x]?.birth||'';
    const m=b.match(/\d{4}/);
    return m?parseInt(m[0]):9999;
  }
  kids.sort((a,b)=>{
    const oa=FAM[a]?.order;
    const ob=FAM[b]?.order;
    /* اللي عنده order صريح يتقدم على اللي ليس له order */
    if(oa!=null && ob!=null) return oa-ob;
    if(oa!=null) return -1;
    if(ob!=null) return 1;
    /* كلاهما بدون order: رتّب بحسب سنة الميلاد */
    return birthYear(a)-birthYear(b);
  });
  return kids;
}

function saveEdit(){
  if(!editingId)return;
  const shortVal=document.getElementById('edit-short').value.trim();
  const orderRaw=document.getElementById('edit-order')?.value.trim();
  const orderVal=orderRaw?parseInt(orderRaw):null;
  const fullName=document.getElementById('edit-name').value.trim();
  const nasabVal=(document.getElementById('edit-nasab')?.value||'').trim();
  const bio=document.getElementById('edit-bio').value.trim();
  const birth=document.getElementById('edit-birth').value.trim();
  const death=document.getElementById('edit-death').value.trim();
  if(!shortVal){showToast('الاسم الأول مطلوب');return}

  /* معالجة الترتيب — يشمل الأبناء والزوجات */
  const parId=FAM[editingId]?.par;
  if(parId && FAM[parId]){
    const isWifeEntry=(FAM[editingId]?.role==='wife');
    /* قائمة الأقران: إذا زوجة → spouseIds الأب، وإلا → children الأب */
    const peers=isWifeEntry
      ? (FAM[parId].spouseIds||[]).filter(s=>s!==editingId)
      : (FAM[parId].children||[]).filter(s=>s!==editingId);
    if(orderVal){
      /* إذا تكرر الرقم: نزيح كل من له نفس الرقم أو أكبر +1 */
      peers.forEach(s=>{
        if(FAM[s]?.order!=null && FAM[s].order>=orderVal) FAM[s].order++;
      });
    } else {
      /* إذا حُذف الترتيب: اضغط الفجوات في أرقام الأقران */
      const ordered=peers.filter(s=>FAM[s]?.order!=null);
      ordered.sort((a,b)=>FAM[a].order-FAM[b].order);
      ordered.forEach((s,i)=>{ FAM[s].order=i+1; });
    }
  }

  FAM[editingId].short=shortVal;
  if(orderVal) FAM[editingId].order=orderVal; else delete FAM[editingId].order;
  FAM[editingId].name=fullName||shortVal;
  if(nasabVal) FAM[editingId].nasab=nasabVal; else delete FAM[editingId].nasab;
  FAM[editingId].bio=bio;
  if(birth) FAM[editingId].birth=birth; else delete FAM[editingId].birth;
  if(death) FAM[editingId].death=death; else delete FAM[editingId].death;
  if(pendingPhoto)FAM[editingId].photo=pendingPhoto;
  if(editingRada) FAM[editingId].rada=true; else delete FAM[editingId].rada;
  /* جنس من relType */
  FAM[editingId].sex=editingSex;
  const reltypeVal=document.getElementById('edit-reltype')?.value;
  if(reltypeVal) FAM[editingId].relType=reltypeVal;
  const relofVal=(document.getElementById('edit-relof')?.value||'').trim();
  if(relofVal) FAM[editingId].relOf=relofVal; else delete FAM[editingId].relOf;

  /* تطبيق الزوج/ة المحدد */
  if(selectedSpouseSex){
    const spId='sp_'+editingId+'_'+Date.now();
    FAM[spId]={name:(selectedSpouseSex==='f'?'زوجة':'زوج'),sex:selectedSpouseSex,role:'wife',par:editingId,children:[],photo:null};
    if(!FAM[editingId].spouseIds) FAM[editingId].spouseIds=[];
    FAM[editingId].spouseIds.push(spId);
  }
  /* تطبيق الطفل/ة المحدد */
  if(selectedChildSex){
    const chId='ch_'+editingId+'_'+Date.now();
    FAM[chId]={name:(selectedChildSex==='f'?'طفلة':'طفل'),sex:selectedChildSex,par:editingId,children:[],photo:null};
    if(!FAM[editingId].children) FAM[editingId].children=[];
    FAM[editingId].children.push(chId);
  }

  saveData();

  /* إعادة رسم فورية */
  closeInfo();
  const curId=history[history.length-1];
  const parIdRefresh=FAM[editingId]?.par;
  if(curId&&curId===editingId){
    history.pop();expandNode(editingId);
  } else if(curId&&curId!==editingId){
    history.pop();expandNode(curId);
  } else if(parIdRefresh&&FAM[parIdRefresh]){
    /* fallback: أعد رسم الأب */
    expandNode(parIdRefresh);
  } else {
    refreshUI(editingId);
  }
  showToast('✓ تم الحفظ');
}

/* ── أزرار الجنس toggle ── */
let selectedSpouseSex=null, selectedChildSex=null;

function toggleSpouseSex(sex){
  if(selectedSpouseSex===sex){
    /* إلغاء التحديد */
    selectedSpouseSex=null;
    document.getElementById('spouse-btn-m').classList.remove('selected');
    document.getElementById('spouse-btn-f').classList.remove('selected');
  } else {
    selectedSpouseSex=sex;
    document.getElementById('spouse-btn-m').classList.toggle('selected', sex==='m');
    document.getElementById('spouse-btn-f').classList.toggle('selected', sex==='f');
  }
}

function toggleChildSex(sex){
  if(selectedChildSex===sex){
    selectedChildSex=null;
    document.getElementById('child-btn-m').classList.remove('selected');
    document.getElementById('child-btn-f').classList.remove('selected');
  } else {
    selectedChildSex=sex;
    document.getElementById('child-btn-m').classList.toggle('selected', sex==='m');
    document.getElementById('child-btn-f').classList.toggle('selected', sex==='f');
  }
}

/* ── إضافة زوج/ة (تُعلَّق حتى الحفظ) ── */
function quickAddSpouse(sex){
  if(!editingId||!sex)return;
  const pid=editingId;
  const spId='sp_'+pid+'_'+Date.now();
  const spData={name:(sex==='f'?'زوجة جديدة':'زوج جديد'),sex,role:'wife',par:pid,children:[],photo:null};
  if(!pendingSpouses[pid])pendingSpouses[pid]=[];
  pendingSpouses[pid].push({id:spId,data:spData});
  showToast('سيظهر الزوج/ة بعد الحفظ ✓');
}

/* ── إضافة مولود من نافذة المعلومات ── */
function cancelAddChild(){
  selectedChildSex=null;
  document.getElementById('child-btn-m').classList.remove('selected');
  document.getElementById('child-btn-f').classList.remove('selected');
  document.getElementById('new-child-birth').value='';
}
function confirmAddChild(){
  const shortVal=document.getElementById('new-child-name').value.trim();
  if(!shortVal){showToast('الرجاء إدخال الاسم');return;}
  const sex=document.getElementById('new-child-sex').value;
  const birth=document.getElementById('new-child-birth').value.trim();
  /* توليد معرّف فريد من أول كلمة */
  let baseId='child_'+(Date.now()%100000);
  let newId=baseId;let n=2;while(FAM[newId])newId=baseId+'_'+n++;
  /* إضافة للبيانات — short هو اسم البطاقة، name يمكن تعديله لاحقاً من نافذة المعلومات */
  /* الأبناء دايماً من الأب: لو أضفت من نافذة زوجة، الابن يتسجل على زوجها وأمه هي */
  let fatherId=editingId, motherId=null;
  const ed=FAM[editingId];
  if(ed.role==='wife' && ed.sex==='f'){fatherId=ed.par;motherId=editingId;}
  FAM[newId]={name:shortVal, short:shortVal, sex, par:fatherId};
  if(motherId) FAM[newId].mother=motherId;
  if(birth) FAM[newId].birth=birth;
  if(!FAM[fatherId].children) FAM[fatherId].children=[];
  FAM[fatherId].children.push(newId);
  saveData();
  cancelAddChild();
  showToast('✓ تمت إضافة '+shortVal);
  if(motherId){history.pop();showSpouseView(motherId);return;}
  /* إذا كنا في عرض هذا الشخص أعد الرسم لإظهار الدائرة الجديدة */
  if(history[history.length-1]===editingId){
    hideAll();
    const {w,h}=getSize();
    createNode(editingId);
    nodeEls[editingId].style.left=w/2+'px';
    nodeEls[editingId].style.top=h*0.17+'px';
    nodeEls[editingId].classList.remove('hidden');
    nodeEls[editingId].classList.add('visible');
    const kids=FAM[editingId].children||[];
    kids.forEach(k=>createNode(k));
    placeNodes(kids,editingId);
    setTimeout(()=>{
      kids.forEach(k=>drawLine(editingId,k,FAM[k]?.role==='wife'));
      showSpouseFor(editingId);
    },150);
  }
}

function refreshUI(id){
  const m=FAM[id];
  if(!m)return;
  if(nodeEls[id]){
    const ring=nodeEls[id].querySelector('.avatar-ring');
    if(ring){
      ring.innerHTML=avatarHTML(id);
      ring.className='avatar-ring'+(m.sex==='f'?' female':'')+(m.rada?' rada':'')+(m.role==='root'?' root':'');
    }
    const lbl=nodeEls[id].querySelector('.node-name');if(lbl)lbl.textContent=m.short||shortName(m.name,id);
  }
  const card=document.querySelector(`.profile-card[data-id="${id}"]`);
  if(card){
    const av=card.querySelector('.pc-avatar');
    if(av){
      av.innerHTML=avatarHTML(id);
      av.className='pc-avatar'+(m.sex==='f'?' female':'')+(m.rada?' rada':'')+(m.role==='root'?' root':'')+(m.rada?(m.sex==='f'?' rada rada-f':' rada rada-m'):'');
    }
    const nm=card.querySelector('.pc-name');if(nm)nm.textContent=m.name;
    const role=card.querySelector('.pc-role');
    if(role)role.textContent=m.role==='root'?'الجد الأكبر':m.role==='wife'?'زوجة':(m.rada?(m.sex==='f'?'رضاعة أنثى':'رضاعة ذكر'):getNasab(id));
  }
  ftBuilt=false;document.getElementById('full-tree-svg').innerHTML='';
}
function closeModal(){closeInfo()} /* للتوافق */
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.removeAttribute('hidden');setTimeout(()=>t.setAttribute('hidden',''),2800)}

showRoot();
startCloud();
</script>
