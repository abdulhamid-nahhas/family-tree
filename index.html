<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>شجرة عائلة آل زامل نحاس</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --gold: #c9a84c;
  --gold-lt: #e0c97a;
  --rose: #c97a8a;
  --rose-lt: #e8b4be;
  --bg: #0d0d0d;
  --bg2: #1a1a1a;
  --bg3: #242424;
  --text: #f0ead6;
  --text2: #a09070;
  --radius: 14px;
  --node-size: 80px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; height: 100dvh; }

/* ===== CANVAS ===== */
#canvas {
  position: relative;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  touch-action: none;
}
#world {
  position: absolute;
  width: 4000px;
  height: 4000px;
  transform-origin: 0 0;
  z-index: 1;
}

/* ===== NODE ===== */
.node {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  width: 90px;
  transform: translate(-50%, -50%);
  z-index: 10;
  transition: opacity .3s;
}
.node.hidden { opacity: 0; pointer-events: none; }
.node.visible { opacity: 1; pointer-events: all; }

.avatar-wrap {
  position: relative;
  width: var(--node-size);
  height: var(--node-size);
}
.avatar-ring {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 2.5px solid var(--gold);
  overflow: hidden;
  background: var(--bg3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
}
.avatar-ring.female { border-color: var(--rose); }
.avatar-ring img { width: 100%; height: 100%; object-fit: cover; }

.order-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  background: var(--gold);
  color: #000;
  font-size: .55rem;
  font-weight: 800;
  border-radius: 50%;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}
.female .order-badge { background: var(--rose); }

.info-btn {
  position: absolute;
  bottom: -4px;
  left: -4px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--bg2);
  border: 1.5px solid var(--gold);
  color: var(--gold);
  font-size: .6rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 3;
}
.female .info-btn { border-color: var(--rose); color: var(--rose); }

.node-name {
  font-size: .65rem;
  color: var(--text);
  margin-top: 4px;
  text-align: center;
  max-width: 90px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
}

/* ===== SVG LINES ===== */
#lines-svg {
  position: absolute;
  top: 0; left: 0;
  width: 4000px; height: 4000px;
  pointer-events: none;
  z-index: 1;
}

/* ===== TOP BAR ===== */
#topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: linear-gradient(to bottom, rgba(13,13,13,.98), transparent);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 100;
}
#back-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg2);
  border: 1.5px solid var(--gold);
  color: var(--gold);
  font-size: 1rem;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
}
#back-btn.show { display: flex; }
#title-text {
  font-size: .85rem;
  color: var(--gold);
  font-weight: 700;
}

/* ===== LEGEND ===== */
#legend {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(26,26,26,.92);
  border: 1px solid #333;
  border-radius: 20px;
  padding: 6px 14px;
  display: flex;
  gap: 14px;
  align-items: center;
  z-index: 100;
  font-size: .6rem;
  color: var(--text2);
}
.leg-item { display: flex; align-items: center; gap: 5px; }
.leg-line { width: 22px; height: 2px; }
.leg-line.child { background: var(--gold-lt); }
.leg-line.spouse { background: var(--rose-lt); border-top: 2px dashed var(--rose-lt); height: 0; }

/* ===== INFO PANEL ===== */
#info-panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--bg2);
  border-radius: var(--radius) var(--radius) 0 0;
  border-top: 1px solid #333;
  padding: 16px;
  z-index: 200;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  max-height: 85dvh;
  overflow-y: auto;
}
#info-panel.open { transform: translateY(0); }

.panel-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
.panel-avatar {
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 2px solid var(--gold);
  overflow: hidden;
  background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem;
  flex-shrink: 0;
  cursor: pointer;
  position: relative;
}
.panel-avatar.female { border-color: var(--rose); }
.panel-avatar-edit {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,.55);
  font-size: .5rem;
  text-align: center;
  padding: 2px 0;
  color: #fff;
}
.panel-avatar img { width: 100%; height: 100%; object-fit: cover; }

.panel-names { flex: 1; }
.panel-first-name input {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
  background: transparent;
  border: none;
  border-bottom: 1px solid #444;
  outline: none;
  width: 100%;
  padding: 2px 0;
  font-family: inherit;
  direction: rtl;
}
.panel-full-name {
  font-size: .7rem;
  color: var(--text2);
  margin-top: 4px;
}

.panel-row {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}
.panel-field {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.panel-field label {
  font-size: .6rem;
  color: var(--text2);
}
.panel-field input, .panel-field textarea {
  background: var(--bg3);
  border: 1px solid #333;
  border-radius: 8px;
  color: var(--text);
  padding: 7px 10px;
  font-size: .78rem;
  font-family: inherit;
  outline: none;
  direction: rtl;
}
.panel-field textarea { resize: none; height: 60px; }
.panel-field input:focus, .panel-field textarea:focus { border-color: var(--gold); }

.age-display {
  font-size: .7rem;
  color: var(--gold);
  align-self: flex-end;
  padding-bottom: 7px;
}

.add-btns {
  display: flex;
  gap: 8px;
  margin: 14px 0 10px;
  flex-wrap: wrap;
}
.add-btn {
  flex: 1;
  min-width: 80px;
  padding: 8px 4px;
  border-radius: 10px;
  border: 1.5px solid var(--gold);
  background: transparent;
  color: var(--gold);
  font-size: .7rem;
  cursor: pointer;
  font-family: inherit;
  transition: background .2s;
}
.add-btn:active { background: rgba(201,168,76,.15); }
.add-btn.rose { border-color: var(--rose); color: var(--rose); }

.panel-actions {
  display: flex;
  gap: 10px;
}
.save-btn {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: var(--gold);
  color: #000;
  font-size: .85rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.del-btn {
  width: 42px;
  border-radius: 10px;
  border: 1.5px solid #c0392b;
  background: transparent;
  color: #c0392b;
  font-size: 1rem;
  cursor: pointer;
}

/* ===== CROP MODAL ===== */
#crop-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.85);
  z-index: 300;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 20px;
}
#crop-modal.open { display: flex; }
#crop-container {
  position: relative;
  width: min(320px, 90vw);
  height: min(320px, 90vw);
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid var(--gold);
  background: #111;
  touch-action: none;
}
#crop-img {
  position: absolute;
  transform-origin: center center;
  user-select: none;
  -webkit-user-select: none;
}
.crop-controls { display: flex; gap: 12px; }
.crop-btn {
  padding: 10px 24px;
  border-radius: 10px;
  border: none;
  font-size: .85rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.crop-confirm { background: var(--gold); color: #000; }
.crop-cancel { background: #333; color: var(--text); }

/* ===== TOAST ===== */
#toast {
  position: fixed;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg3);
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 8px 20px;
  border-radius: 20px;
  font-size: .8rem;
  opacity: 0;
  transition: all .3s;
  z-index: 400;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== OVERLAY ===== */
#overlay {
  position: fixed;
  inset: 0;
  z-index: 150;
  display: none;
}
#overlay.open { display: block; }

/* hidden file input */
#photo-input { display: none; }
</style>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
  <button id="back-btn" onclick="goBack()">←</button>
  <span id="title-text">آل زامل نحاس</span>
  <div style="width:36px"></div>
</div>

<!-- Canvas -->
<div id="canvas">
  <div id="world">
    <svg id="lines-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<!-- Legend -->
<div id="legend">
  <div class="leg-item"><div class="leg-line child"></div><span>أبناء</span></div>
  <div class="leg-item"><div class="leg-line spouse"></div><span>زوج/زوجة</span></div>
</div>

<!-- Overlay (close panel) -->
<div id="overlay" onclick="closePanel()"></div>

<!-- Info Panel -->
<div id="info-panel">
  <div class="panel-header">
    <div class="panel-avatar" id="panel-avatar" onclick="pickPhoto()">
      <span id="panel-avatar-emoji">👤</span>
      <img id="panel-avatar-img" src="" style="display:none">
      <div class="panel-avatar-edit">تعديل</div>
    </div>
    <div class="panel-names">
      <div class="panel-first-name">
        <input id="edit-name" placeholder="الاسم الأول" oninput="updateFullName()">
      </div>
      <div class="panel-full-name" id="edit-fullname"></div>
    </div>
  </div>

  <div class="panel-row">
    <div class="panel-field">
      <label>الميلاد</label>
      <input id="edit-birth" type="number" placeholder="مثال: 1980" min="1800" max="2030" oninput="updateAge()">
    </div>
    <div class="age-display" id="age-display"></div>
    <div class="panel-field">
      <label>الوفاة</label>
      <input id="edit-death" type="number" placeholder="اتركه فارغ إن حي" min="1800" max="2030" oninput="updateAge()">
    </div>
  </div>

  <div class="panel-row">
    <div class="panel-field">
      <label>السيرة / ملاحظات</label>
      <textarea id="edit-bio" placeholder="أي ملاحظات..."></textarea>
    </div>
  </div>

  <div class="add-btns">
    <button class="add-btn" onclick="addChild('m')">+ طفل</button>
    <button class="add-btn" onclick="addChild('f')">+ طفلة</button>
    <button class="add-btn rose" onclick="addSpouse()">+ زوج/زوجة</button>
  </div>

  <div class="panel-actions">
    <button class="save-btn" onclick="saveEdit()">حفظ ✓</button>
    <button class="del-btn" onclick="deletePerson()" title="حذف">🗑</button>
  </div>
</div>

<!-- Crop Modal -->
<div id="crop-modal">
  <div id="crop-container">
    <img id="crop-img" draggable="false">
  </div>
  <div class="crop-controls" style="margin-bottom:8px">
    <button class="crop-btn" onclick="cropZoom(-0.1)">－</button>
    <button class="crop-btn" onclick="cropZoom(0.1)">＋</button>
  </div>
  <div class="crop-controls">
    <button class="crop-btn crop-confirm" onclick="confirmCrop()">تأكيد</button>
    <button class="crop-btn crop-cancel" onclick="closeCrop()">إلغاء</button>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="photo-input" accept="image/*" onchange="handlePhotoFile(event)">

<script>
// =============================================
// CONFIG — Supabase
// =============================================
const SUPABASE_URL  = 'https://thzczmcuybqrvcxgfzny.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_HCoYRY02NYDPochgwM9QwA_h8Oe3rs4';

// =============================================
// DATA
// =============================================
let FAM = {};
let _sb = null;

function getSB() {
  if (_sb) return _sb;
  _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  return _sb;
}

// =============================================
// SUPABASE HELPERS
// =============================================
async function loadData() {
  try {
    const sb = getSB();
    const { data, error } = await sb.from('members').select('id, data');
    if (error) throw error;
    FAM = {};
    for (const row of (data || [])) {
      FAM[row.id] = row.data;
    }
  } catch(e) {
    console.error('loadData error', e);
    try { FAM = JSON.parse(localStorage.getItem('famData') || '{}'); } catch(e2) { FAM = {}; }
  }
  if (!FAM['zamil']) seedRoot();
  renderCurrent();

  // Real-time — أي تغيير يظهر فوراً
  getSB()
    .channel('members-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, async () => {
      const { data } = await getSB().from('members').select('id, data');
      FAM = {};
      for (const row of (data || [])) FAM[row.id] = row.data;
      renderCurrent();
    })
    .subscribe();
}

function seedRoot() {
  FAM['zamil'] = {
    id: 'zamil', name: 'زامل', sex: 'm', role: 'root',
    spouseIds: [], children: [], bio: '', birth: '', death: '', photo: null
  };
}

async function saveData() {
  try {
    const sb = getSB();
    const rows = Object.values(FAM).map(m => ({ id: m.id, data: m }));
    const { error } = await sb.from('members').upsert(rows, { onConflict: 'id' });
    if (error) throw error;
    localStorage.setItem('famData', JSON.stringify(FAM));
  } catch(e) {
    console.error('saveData error', e);
    localStorage.setItem('famData', JSON.stringify(FAM));
  }
}


// =============================================
// STATE
// =============================================
let currentId = 'zamil';      // الشخص المعروض الآن
let selectedSpouseId = null;  // الزوجة المختارة (لو أكثر من واحدة)
let history = [];             // تاريخ التنقل
let editingId = null;         // الشخص المفتوح في النافذة

// =============================================
// RENDER
// =============================================
function renderCurrent() {
  clearWorld();
  const m = FAM[currentId];
  if (!m) return;

  const W = 2000, H = 2000; // مركز العالم

  // ارسم الشخص الحالي في المنتصف
  drawNode(currentId, W, H);

  const spouses = (m.spouseIds || []).filter(s => FAM[s]);

  if (spouses.length === 0) {
    // لا زوجات — ارسم الأبناء فقط
    drawChildren(currentId, null, W, H);
  } else if (spouses.length === 1) {
    // زوجة واحدة — تظهر هي والأبناء فوراً
    const spId = spouses[0];
    drawSpouseNext(currentId, spId, W, H);
    drawChildren(currentId, spId, W, H);
  } else {
    // زوجات متعددة
    if (selectedSpouseId && spouses.includes(selectedSpouseId)) {
      // زوجة مختارة — تظهر جنبه والأبناء
      drawSpouseNext(currentId, selectedSpouseId, W, H);
      drawChildren(currentId, selectedSpouseId, W, H);
    } else {
      // ارسم الزوجات متفرعات
      drawSpousesFan(currentId, spouses, W, H);
    }
  }
}

function clearWorld() {
  const world = document.getElementById('world');
  const svg = document.getElementById('lines-svg');
  // احذف كل العقد
  world.querySelectorAll('.node').forEach(n => n.remove());
  // امسح الخطوط
  svg.innerHTML = '';
}

// ===== رسم عقدة =====
function drawNode(id, x, y) {
  const m = FAM[id];
  if (!m) return;
  const world = document.getElementById('world');

  const div = document.createElement('div');
  div.className = 'node hidden';
  div.id = 'node_' + id;
  div.style.left = x + 'px';
  div.style.top = y + 'px';

  const isFemale = m.sex === 'f';

  // ترتيب
  const orderBadge = m._order ? `<div class="order-badge">#${m._order}</div>` : '';

  // صورة
  let avatarInner = isFemale ? '👩' : '👨';
  if (m.photo) avatarInner = `<img src="${m.photo}" alt="">`;

  div.innerHTML = `
    <div class="avatar-wrap">
      <div class="avatar-ring ${isFemale ? 'female' : ''}">
        ${avatarInner}
      </div>
      ${orderBadge}
      <div class="info-btn" onclick="event.stopPropagation();openPanel('${id}')">ⓘ</div>
    </div>
    <div class="node-name">${shortName(m.name)}</div>
  `;

  div.addEventListener('click', () => onNodeClick(id));
  world.appendChild(div);

  requestAnimationFrame(() => {
    div.classList.remove('hidden');
    div.classList.add('visible');
  });
}

function shortName(name) {
  if (!name) return '؟';
  const parts = name.trim().split(' ');
  return parts[0] || '؟';
}

// ===== رسم زوجة/زوج جنب الشخص =====
function drawSpouseNext(ownerId, spouseId, cx, cy) {
  const owner = FAM[ownerId];
  const sp = FAM[spouseId];
  if (!sp) return;

  // الذكر: زوجته يمينه (RTL: يمين = x أكبر)
  // الأنثى: زوجها يسارها (RTL: يسار = x أصغر)
  const OFFSET = 160;
  let sx, sy;
  if (owner.sex === 'm') {
    sx = cx + OFFSET; sy = cy;
  } else {
    sx = cx - OFFSET; sy = cy;
  }

  drawNode(spouseId, sx, sy);
  drawDashedLine(cx, cy, sx, sy);
}

// ===== رسم الزوجات كمروحة =====
function drawSpousesFan(ownerId, spouseIds, cx, cy) {
  const RADIUS = 160;
  const owner = FAM[ownerId];

  // الذكر: الزوجات على اليمين
  // الأنثى: الزوجة/الأزواج على اليسار
  const baseAngle = owner.sex === 'm' ? 0 : 180; // درجات
  const spread = Math.min(80, 20 * spouseIds.length);
  const start = baseAngle - spread;
  const step = spouseIds.length > 1 ? (spread * 2) / (spouseIds.length - 1) : 0;

  spouseIds.forEach((spId, i) => {
    const angleDeg = spouseIds.length === 1 ? baseAngle : start + step * i;
    const angleRad = (angleDeg * Math.PI) / 180;
    const sx = cx + RADIUS * Math.cos(angleRad);
    const sy = cy + RADIUS * Math.sin(angleRad);

    drawNode(spId, sx, sy);
    drawDashedLine(cx, cy, sx, sy);

    // عند الضغط على الزوجة تُختار
    const el = document.getElementById('node_' + spId);
    if (el) {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedSpouseId = spId;
        renderCurrent();
      }, { once: true });
    }
  });
}

// ===== رسم الأبناء =====
function drawChildren(parentId, fromSpouseId, cx, cy) {
  const parent = FAM[parentId];
  if (!parent) return;

  // الأبناء من هذه الزوجة، أو كل الأبناء لو ما في زوجة
  let kids = (parent.children || []).filter(k => FAM[k]);
  if (fromSpouseId) {
    kids = kids.filter(k => FAM[k]?.motherId === fromSpouseId || FAM[k]?.fatherId === parentId);
    // إذا تم تحديد زوجة معينة، اعرض أبناءها فقط
    kids = (parent.children || []).filter(k => {
      const km = FAM[k];
      return km && km.motherId === fromSpouseId;
    });
    // لو ما في motherId محدد، اعرض الكل
    if (kids.length === 0) {
      kids = (parent.children || []).filter(k => FAM[k]);
    }
  }

  if (kids.length === 0) return;

  // رتب حسب الميلاد
  kids = sortByBirth(kids);
  // أضف رقم الترتيب
  kids.forEach((k, i) => { FAM[k]._order = i + 1; });

  const CHILD_Y = cy + 180;
  const totalW = (kids.length - 1) * 130;
  const startX = cx - totalW / 2;

  kids.forEach((kId, i) => {
    const kx = startX + i * 130;
    const ky = CHILD_Y;
    drawNode(kId, kx, ky);
    drawSolidLine(cx, cy, kx, ky);
  });
}

function sortByBirth(ids) {
  return ids.slice().sort((a, b) => {
    const ba = parseInt(FAM[a]?.birth) || 9999;
    const bb = parseInt(FAM[b]?.birth) || 9999;
    return ba - bb;
  });
}

// ===== رسم الخطوط =====
function drawSolidLine(x1, y1, x2, y2) {
  const svg = document.getElementById('lines-svg');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  // خط منحني من الأب للابن
  const mx = (x1 + x2) / 2;
  const my = (y1 + y2) / 2;
  path.setAttribute('d', `M ${x1} ${y1} Q ${x1} ${my} ${x2} ${y2}`);
  path.setAttribute('stroke', '#c9a84c');
  path.setAttribute('stroke-width', '1.8');
  path.setAttribute('fill', 'none');
  path.setAttribute('opacity', '0.75');
  svg.appendChild(path);
}

function drawDashedLine(x1, y1, x2, y2) {
  const svg = document.getElementById('lines-svg');
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('stroke', '#c97a8a');
  line.setAttribute('stroke-width', '1.8');
  line.setAttribute('stroke-dasharray', '6,4');
  line.setAttribute('opacity', '0.8');
  svg.appendChild(line);
}

// =============================================
// NAVIGATION
// =============================================
function onNodeClick(id) {
  const m = FAM[id];
  if (!m) return;

  // الزوجة لا تفتح view مستقل — بس زر ⓘ
  if (m.role === 'spouse') return;

  // انتقل لهذا الشخص
  history.push(currentId);
  currentId = id;
  selectedSpouseId = null;
  document.getElementById('back-btn').classList.add('show');
  renderCurrent();
  centerWorld();
}

function goBack() {
  if (history.length === 0) return;
  currentId = history.pop();
  selectedSpouseId = null;
  if (history.length === 0) document.getElementById('back-btn').classList.remove('show');
  renderCurrent();
  centerWorld();
}

function centerWorld() {
  const canvas = document.getElementById('canvas');
  const W = canvas.clientWidth;
  const H = canvas.clientHeight;
  const scale = parseFloat(document.getElementById('world').style.transform?.match(/scale\(([^)]+)\)/)?.[1] || 1);
  const tx = W / 2 - 2000 * scale;
  const ty = H / 2 - 2000 * scale;
  document.getElementById('world').style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}

// =============================================
// PAN & ZOOM
// =============================================
let isPanning = false, panStart = {x:0,y:0}, worldPos = {x:0,y:0}, worldScale = 1;

function initPanZoom() {
  const canvas = document.getElementById('canvas');
  const world = document.getElementById('world');

  // Desktop mouse
  canvas.addEventListener('mousedown', e => {
    if (e.target.closest('.node') || e.target.closest('#info-panel')) return;
    isPanning = true;
    panStart = { x: e.clientX - worldPos.x, y: e.clientY - worldPos.y };
  });
  window.addEventListener('mousemove', e => {
    if (!isPanning) return;
    worldPos.x = e.clientX - panStart.x;
    worldPos.y = e.clientY - panStart.y;
    applyTransform();
  });
  window.addEventListener('mouseup', () => isPanning = false);

  // Wheel zoom
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    worldScale = Math.min(2, Math.max(0.3, worldScale * delta));
    applyTransform();
  }, { passive: false });

  // Mobile touch
  let touches = [];
  let pinchDist = 0;
  canvas.addEventListener('touchstart', e => {
    if (e.target.closest('.node') || e.target.closest('#info-panel')) return;
    touches = Array.from(e.touches);
    if (touches.length === 1) {
      isPanning = true;
      panStart = { x: touches[0].clientX - worldPos.x, y: touches[0].clientY - worldPos.y };
    } else if (touches.length === 2) {
      isPanning = false;
      pinchDist = getDist(touches[0], touches[1]);
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    touches = Array.from(e.touches);
    if (touches.length === 1 && isPanning) {
      worldPos.x = touches[0].clientX - panStart.x;
      worldPos.y = touches[0].clientY - panStart.y;
      applyTransform();
    } else if (touches.length === 2) {
      const d = getDist(touches[0], touches[1]);
      const delta = d / pinchDist;
      pinchDist = d;
      worldScale = Math.min(2, Math.max(0.3, worldScale * delta));
      applyTransform();
    }
  }, { passive: false });

  canvas.addEventListener('touchend', () => { isPanning = false; touches = []; });

  // Initial position — center on node
  const W = canvas.clientWidth;
  const H = canvas.clientHeight;
  worldPos.x = W / 2 - 2000;
  worldPos.y = H / 2 - 2000;
  applyTransform();
}

function applyTransform() {
  document.getElementById('world').style.transform =
    `translate(${worldPos.x}px,${worldPos.y}px) scale(${worldScale})`;
}

function getDist(t1, t2) {
  return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
}

// =============================================
// INFO PANEL
// =============================================
function openPanel(id) {
  editingId = id;
  const m = FAM[id];
  if (!m) return;

  // الاسم
  document.getElementById('edit-name').value = m.name || '';
  updateFullName();

  // الميلاد / الوفاة
  document.getElementById('edit-birth').value = m.birth || '';
  document.getElementById('edit-death').value = m.death || '';
  updateAge();

  // البيو
  document.getElementById('edit-bio').value = m.bio || '';

  // الصورة
  const avatarEl = document.getElementById('panel-avatar');
  const imgEl = document.getElementById('panel-avatar-img');
  const emojiEl = document.getElementById('panel-avatar-emoji');
  avatarEl.className = 'panel-avatar' + (m.sex === 'f' ? ' female' : '');
  if (m.photo) {
    imgEl.src = m.photo; imgEl.style.display = 'block';
    emojiEl.style.display = 'none';
  } else {
    imgEl.style.display = 'none'; imgEl.src = '';
    emojiEl.style.display = 'block';
    emojiEl.textContent = m.sex === 'f' ? '👩' : '👨';
  }

  document.getElementById('info-panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closePanel() {
  document.getElementById('info-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  editingId = null;
}

function updateFullName() {
  if (!editingId) return;
  const m = FAM[editingId];
  const firstName = document.getElementById('edit-name').value.trim() || m?.name || '';
  const fullName = buildFullName(editingId, firstName);
  document.getElementById('edit-fullname').textContent = fullName;
}

function buildFullName(id, overrideName) {
  const m = FAM[id];
  if (!m) return '';
  const name = overrideName || m.name || '';
  // ابن أم بنت
  const connector = m.sex === 'f' ? 'بنت' : 'بن';
  const parName = m.fatherId && FAM[m.fatherId] ? FAM[m.fatherId].name : (m.par ? (FAM[m.par]?.name || '') : '');
  if (!parName) return name + ' نحاس';
  return `${name} ${connector} ${parName} نحاس`;
}

function updateAge() {
  const birth = parseInt(document.getElementById('edit-birth').value);
  const death = parseInt(document.getElementById('edit-death').value);
  const ageEl = document.getElementById('age-display');
  if (death && birth) {
    ageEl.textContent = `${death - birth} سنة`;
  } else if (birth && !death) {
    const age = new Date().getFullYear() - birth;
    if (age >= 0 && age < 150) ageEl.textContent = `${age} سنة`;
    else ageEl.textContent = '';
  } else {
    ageEl.textContent = '';
  }
}

async function saveEdit() {
  if (!editingId) return;
  const m = FAM[editingId];
  m.name = document.getElementById('edit-name').value.trim() || m.name;
  m.birth = document.getElementById('edit-birth').value;
  m.death = document.getElementById('edit-death').value;
  m.bio = document.getElementById('edit-bio').value;
  await saveData();
  closePanel();
  renderCurrent();
  showToast('✓ تم الحفظ');
}

async function deletePerson() {
  if (!editingId || editingId === 'zamil') { showToast('لا يمكن حذف الجد الأكبر'); return; }
  const m = FAM[editingId];
  // احذف من قائمة الأب
  if (m.fatherId && FAM[m.fatherId]) {
    FAM[m.fatherId].children = (FAM[m.fatherId].children || []).filter(c => c !== editingId);
  }
  // احذف من قائمة الزوجات
  if (m.ownerId && FAM[m.ownerId]) {
    FAM[m.ownerId].spouseIds = (FAM[m.ownerId].spouseIds || []).filter(s => s !== editingId);
  }
  // احذف أبناءه (recursive)
  deleteRecursive(editingId);
  await saveData();
  closePanel();
  if (history.length > 0) {
    currentId = history.pop();
  }
  selectedSpouseId = null;
  renderCurrent();
  showToast('🗑 تم الحذف');
}

function deleteRecursive(id) {
  const m = FAM[id];
  if (!m) return;
  (m.children || []).forEach(deleteRecursive);
  (m.spouseIds || []).forEach(deleteRecursive);
  delete FAM[id];
}

// =============================================
// ADD CHILD / SPOUSE
// =============================================
async function addChild(sex) {
  if (!editingId) return;
  const parent = FAM[editingId];

  // الأب الحقيقي: إذا كان editingId زوجة، الأب هو ownerId
  let fatherId, motherId;
  if (parent.role === 'spouse') {
    motherId = editingId;
    fatherId = parent.ownerId;
  } else {
    fatherId = editingId;
    // هل في زوجة مختارة؟
    motherId = selectedSpouseId || (parent.spouseIds?.[0]) || null;
  }

  const realFather = FAM[fatherId];
  if (!realFather) return;

  const newId = 'p_' + Date.now();
  FAM[newId] = {
    id: newId,
    name: sex === 'm' ? 'طفل' : 'طفلة',
    sex: sex,
    role: 'child',
    fatherId: fatherId,
    motherId: motherId,
    children: [],
    spouseIds: [],
    bio: '', birth: '', death: '', photo: null
  };

  if (!realFather.children) realFather.children = [];
  realFather.children.push(newId);

  await saveData();
  closePanel();

  // انتقل للأب لعرض الطفل الجديد
  if (currentId !== fatherId) {
    history.push(currentId);
    currentId = fatherId;
  }
  renderCurrent();
  showToast('✓ تمت الإضافة');
  // افتح نافذة الطفل الجديد
  setTimeout(() => openPanel(newId), 400);
}

async function addSpouse() {
  if (!editingId) return;
  const owner = FAM[editingId];

  const newId = 'sp_' + Date.now();
  const spouseSex = owner.sex === 'm' ? 'f' : 'm';
  FAM[newId] = {
    id: newId,
    name: spouseSex === 'f' ? 'زوجة' : 'زوج',
    sex: spouseSex,
    role: 'spouse',
    ownerId: editingId,
    fatherId: null,
    children: [],
    spouseIds: [],
    bio: '', birth: '', death: '', photo: null
  };

  if (!owner.spouseIds) owner.spouseIds = [];
  owner.spouseIds.push(newId);

  await saveData();
  closePanel();
  selectedSpouseId = newId;
  renderCurrent();
  showToast('✓ تمت الإضافة');
  setTimeout(() => openPanel(newId), 400);
}

// =============================================
// PHOTO
// =============================================
let cropScale = 1, cropX = 0, cropY = 0;
let cropImgNaturalW = 0, cropImgNaturalH = 0;
let cropIsDragging = false, cropDragStart = {x:0,y:0};

function pickPhoto() {
  document.getElementById('photo-input').click();
}

function handlePhotoFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    openCrop(ev.target.result);
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function openCrop(src) {
  const modal = document.getElementById('crop-modal');
  const img = document.getElementById('crop-img');
  cropScale = 1; cropX = 0; cropY = 0;
  img.src = src;
  img.onload = () => {
    cropImgNaturalW = img.naturalWidth;
    cropImgNaturalH = img.naturalHeight;
    // ابدأ بحجم يملأ الدائرة
    const container = document.getElementById('crop-container');
    const size = container.clientWidth;
    cropScale = size / Math.min(cropImgNaturalW, cropImgNaturalH);
    applyCropTransform();
  };
  modal.classList.add('open');
  initCropDrag();
}

function closeCrop() {
  document.getElementById('crop-modal').classList.remove('open');
}

function cropZoom(delta) {
  cropScale = Math.max(0.5, Math.min(5, cropScale + delta));
  applyCropTransform();
}

function applyCropTransform() {
  const img = document.getElementById('crop-img');
  const container = document.getElementById('crop-container');
  const size = container.clientWidth;
  const w = cropImgNaturalW * cropScale;
  const h = cropImgNaturalH * cropScale;
  // تأكد الصورة تغطي الدائرة
  const mx = Math.min(0, Math.max(size - w, cropX));
  const my = Math.min(0, Math.max(size - h, cropY));
  cropX = mx; cropY = my;
  img.style.width = w + 'px';
  img.style.height = h + 'px';
  img.style.left = cropX + 'px';
  img.style.top = cropY + 'px';
}

function initCropDrag() {
  const container = document.getElementById('crop-container');
  container.onmousedown = e => {
    cropIsDragging = true;
    cropDragStart = { x: e.clientX - cropX, y: e.clientY - cropY };
  };
  window.onmousemove = e => {
    if (!cropIsDragging) return;
    cropX = e.clientX - cropDragStart.x;
    cropY = e.clientY - cropDragStart.y;
    applyCropTransform();
  };
  window.onmouseup = () => cropIsDragging = false;

  container.ontouchstart = e => {
    cropIsDragging = true;
    cropDragStart = { x: e.touches[0].clientX - cropX, y: e.touches[0].clientY - cropY };
  };
  container.ontouchmove = e => {
    e.preventDefault();
    if (!cropIsDragging) return;
    cropX = e.touches[0].clientX - cropDragStart.x;
    cropY = e.touches[0].clientY - cropDragStart.y;
    applyCropTransform();
  };
  container.ontouchend = () => cropIsDragging = false;
}

async function confirmCrop() {
  const container = document.getElementById('crop-container');
  const img = document.getElementById('crop-img');
  const size = container.clientWidth;

  const canvas = document.createElement('canvas');
  canvas.width = 200; canvas.height = 200;
  const ctx = canvas.getContext('2d');

  // ارسم دائرة
  ctx.beginPath();
  ctx.arc(100, 100, 100, 0, Math.PI * 2);
  ctx.clip();

  const scale = 200 / size;
  ctx.drawImage(img, cropX * scale, cropY * scale,
    cropImgNaturalW * cropScale * scale,
    cropImgNaturalH * cropScale * scale);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

  // رفع الصورة على Supabase Storage
  if (editingId) {
    try {
      const sb = getSB();
      const blob = await (await fetch(dataUrl)).blob();
      const path = `${editingId}.jpg`;
      const { error } = await sb.storage.from('photos').upload(path, blob, {
        contentType: 'image/jpeg', upsert: true
      });
      if (!error) {
        const { data: { publicUrl } } = sb.storage.from('photos').getPublicUrl(path);
        FAM[editingId].photo = publicUrl + '?t=' + Date.now();
        await saveData();
        closeCrop();
        openPanel(editingId);
        renderCurrent();
        showToast('✓ تم رفع الصورة');
        return;
      }
    } catch(e) { console.error('photo upload error', e); }
  }

  // fallback: base64 مباشر
  if (editingId) {
    FAM[editingId].photo = dataUrl;
    await saveData();
  }
  closeCrop();
  openPanel(editingId);
  renderCurrent();
  showToast('✓ تم رفع الصورة');
}

// =============================================
// TOAST
// =============================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
